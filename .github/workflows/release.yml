name: release

# Build the sideloadable Android TV / Fire TV APK and attach it to a GitHub
# Release on every version tag (and on demand via "Run workflow"). The debug APK
# is debug-signed — no signing secrets — so it builds in plain CI. Store builds
# for Apple TV / Samsung Tizen / LG webOS need vendor developer accounts and are
# built from source per devices/<platform>/README.md (a documented, deliberate
# boundary). The self-host server image is published separately by ci.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create releases + upload assets

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: devices/androidtv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Stage artifact + checksum
        run: |
          mkdir -p dist
          cp devices/androidtv/app/build/outputs/apk/debug/app-debug.apk dist/glanceos-androidtv.apk
          (cd dist && sha256sum glanceos-androidtv.apk > glanceos-androidtv.apk.sha256)
      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: glanceos-androidtv-apk
          path: dist/*
      - name: Attach to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glanceos-androidtv.apk
            dist/glanceos-androidtv.apk.sha256
          body: |
            ## GlanceOS ${{ github.ref_name }}

            **Android TV / Fire TV** — download `glanceos-androidtv.apk` and sideload it
            (enable “install unknown apps”, or `adb install glanceos-androidtv.apk`).
            On first run, point it at your GlanceOS server.

            **Self-host the server:** `docker compose up -d` (`ghcr.io/devank-yadav/glanceos`).

            **Other displays** are built from source — Apple TV, Samsung (Tizen) and
            LG (webOS) need their vendor dev tools; Raspberry Pi uses the kiosk
            installer. See `devices/<platform>/README.md`. Or just point any
            smart-TV browser at `https://<your-server>/screen/?tv=1`.
