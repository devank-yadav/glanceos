# First CI on this repo, deliberately zero-stakes: checks that every link
# in the docs still resolves. Typecheck/lint/test jobs arrive with P2 code.
name: docs

on:
  push:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # A runner has no dev server and no LAN, so localhost / 192.168.x examples in the
          # docs are illustrations, not links — --exclude-all-private skips them.
          # 429 + 403: doc sites rate-limit and block CI runners; neither means a dead link.
          args: >-
            --no-progress --exclude-all-private
            --accept "200..=204,403,429" "./**/*.md"
