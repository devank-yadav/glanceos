# First CI on this repo, deliberately zero-stakes: checks that every link
# in the docs still resolves. Typecheck/lint/test jobs arrive with P2 code.
name: docs

on:
  push:
    paths:
      - "**.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # 429 accepted: doc sites rate-limit CI runners, that's not a dead link
          args: --no-progress --accept "200..=204,429" "./**/*.md"
