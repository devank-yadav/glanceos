<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!--
    CSP: this shell only ever navigates to HOST. It loads no remote scripts and
    inlines no styles of consequence; the single inline <script> below is allowed
    via 'unsafe-inline'. Everything the user sees comes from HOST, not this file.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' http: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>GlanceOS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #101418;
      color: #8a939c;
      overflow: hidden;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 400 2.2vw system-ui, -apple-system, sans-serif;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <!-- Shown for the split second before we redirect to the runtime. -->
  <div id="boot">Loading GlanceOS&#8230;</div>

  <script>
    // ----------------------------------------------------------------------
    // CHANGE ME: point this at YOUR self-hosted GlanceOS server base URL.
    // This is the ONE thing you must edit before packaging. No trailing slash.
    // Examples: "http://glanceos.local:8080"  or  "http://192.168.1.50:8080"
    // ----------------------------------------------------------------------
    var HOST = "http://glanceos.local:8080";

    // Shell version, reported to the server only so the fleet view can show
    // what is running this screen. Bump it when you change this file.
    var NATIVE = "webos-1.0.0";

    // C3 — runtime-configurable host. A host entered on the first-run setup
    // screen is remembered in webview localStorage, so you no longer have to
    // edit HOST and rebuild the .ipk per deployment. Saved host wins; HOST above
    // is only the fallback default. Re-open with ?setup to change it.
    var HOST_KEY = "glanceos.host";
    var PLACEHOLDER = "http://glanceos.local:8080";
    function normalizeHost(s) {
      s = String(s || "").trim();
      if (!s) return "";
      if (!/^https?:\/\//i.test(s)) s = "http://" + s; // bare host/IP → http for LAN
      return s.replace(/\/+$/, "");
    }
    function resolveHost() {
      var saved = "";
      try { saved = (localStorage.getItem(HOST_KEY) || "").trim(); } catch (e) {}
      if (saved) return normalizeHost(saved);
      return HOST === PLACEHOLDER ? "" : normalizeHost(HOST);
    }
    function targetFor(host) {
      return host + "/screen/?tv=1&platform=webos&native=" + encodeURIComponent(NATIVE);
    }

    // ----------------------------------------------------------------------
    // Optional: keep the panel awake at the OS level via the webOS power API.
    // The runtime already requests a web wake-lock; this is belt-and-braces.
    // Guarded behind typeof checks so the app runs WITHOUT webOSTV.js loaded
    // (the default app ships no SDK and stays dependency-free).
    // ----------------------------------------------------------------------
    try {
      if (typeof webOS !== "undefined" && webOS.service && typeof webOS.service.request === "function") {
        webOS.service.request("luna://com.webos.service.tvpower", {
          method: "power/setScreenSaver",
          parameters: { enable: false },
          onFailure: function () { /* no SDK / not permitted: ignore, web wake-lock covers us */ }
        });
      }
    } catch (e) { /* dumb glass never fails loudly */ }

    // ----------------------------------------------------------------------
    // Remote keys. On webOS the 5-way D-pad and magic-remote pointer already
    // emit standard KeyboardEvent.key values (ArrowUp/Down/Left/Right, Enter)
    // straight to the page, and the runtime listens for them — so we do NOT
    // reimplement navigation here. The only webOS-specific key is the remote
    // Back button (keyCode 461). We translate that one press into the runtime's
    // back contract and otherwise stay out of the way.
    // ----------------------------------------------------------------------
    document.addEventListener("keydown", function (ev) {
      if (ev.keyCode === 461) {
        // Let the runtime's own back handling take over once we are on HOST.
        // Before redirect there is nothing to go back to, so just swallow it
        // (disableBackHistoryAPI in appinfo.json stops webOS from exiting).
        ev.preventDefault();
      }
      // All other keys (Arrows, Enter, etc.) are intentionally left untouched
      // so they reach the runtime page unmodified.
    });

    // First-run / ?setup: ask once for the server, remember it, then go.
    function showSetup(prefill) {
      var root = document.getElementById("boot") || document.body;
      root.innerHTML =
        '<div style="max-width:80vw;margin:auto;font:400 1.4vw system-ui,-apple-system,sans-serif;color:#8a939c;text-align:left">' +
        '<div style="color:#e6eaef;font-size:1.9vw;margin-bottom:1vw">Connect this screen to GlanceOS</div>' +
        '<div style="margin-bottom:0.6vw">Enter your server address:</div>' +
        '<input id="hostInput" type="text" value="' + (prefill || "") + '" placeholder="http://192.168.1.50:8080" ' +
        'style="width:100%;box-sizing:border-box;font-size:1.6vw;padding:0.6vw;border-radius:8px;border:2px solid #2c3440;background:#0b0e12;color:#fff" />' +
        '<button id="hostGo" style="margin-top:1vw;font-size:1.6vw;padding:0.6vw 1.6vw;border-radius:8px;border:0;background:#fafafa;color:#101418;cursor:pointer">Connect</button>' +
        '<div style="margin-top:0.8vw;color:#5c6672;font-size:1vw">Remembered on this TV — no rebuild needed. Re-open with ?setup to change it.</div>' +
        '</div>';
      var input = document.getElementById("hostInput");
      var btn = document.getElementById("hostGo");
      var submit = function () {
        var host = normalizeHost(input.value);
        if (!host) { try { input.focus(); } catch (e) {} return; }
        try { localStorage.setItem(HOST_KEY, host); } catch (e) {}
        window.location.replace(targetFor(host));
      };
      if (btn) btn.addEventListener("click", submit);
      if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
      try { if (input) input.focus(); } catch (e) {}
    }

    // Give the document focus so key events are delivered to the page, then go.
    try { window.focus(); } catch (e) {}
    var forceSetup = /[?&]setup\b/.test(location.search);
    var startHost = resolveHost();
    if (!startHost || forceSetup) showSetup(startHost || ""); else window.location.replace(targetFor(startHost));
  </script>
</body>
</html>
