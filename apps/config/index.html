<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GlanceOS turns any screen into a calm, glanceable dashboard you compose like a document — open source, self-hosted, black and white." />
    <!-- Social unfurl (OpenGraph + Twitter). og:image is relative; it resolves against the page origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlanceOS" />
    <meta property="og:title" content="GlanceOS — calm dashboards for any screen" />
    <meta property="og:description" content="Free, open-source, self-hosted dashboard wall. Compose boards from 213 blocks and 153 templates, bind 121 integrations, and run them on any screen." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlanceOS — calm dashboards for any screen" />
    <meta name="twitter:description" content="Free, open-source, self-hosted dashboards for any screen — no subscription, your data stays yours." />
    <meta name="twitter:image" content="/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GlanceOS" />
    <title>GlanceOS — calm dashboards for any screen</title>
    <style>
      /* paint the backdrop before the bundle arrives — no flash, scheme-aware */
      html { background: #fafafa; }
      @media (prefers-color-scheme: dark) { html { background: #191919; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
